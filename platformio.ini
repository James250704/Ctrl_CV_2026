; PlatformIO Project Configuration File
; 棒球機器人 RP2350 多環境編譯設定 (終極白名單排除語法)

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.flash_size = 16MB
monitor_speed = 115200
build_flags = -I include
lib_ldf_mode = deep+

; --- 環境 1: Pico Hub ---
[env:pico_hub]
build_src_filter = +<hub/> 

; --- 環境 2: Pico move ---
[env:pico_move]
build_src_filter = +<move/> 

; --- 環境 3: Pico storage ---
[env:pico_storage]
build_src_filter = +<storage/> 

; --- 環境 4: Pico shoot ---
[env:pico_shoot]
build_src_filter = +<shoot/>

; --- 環境 5: 超音波整合
[env:ultrasonic]
build_src_filter = +<ultrasonic/>

; --- 環境 t1: DBR4 CRSF Monitor (test) ---
[env:pico_dbr4_test]
build_src_filter = +<test/dbr4_test/>

; --- 環境 t2:PPR 測試程式
[env:motor_PPR_test]
build_src_filter = +<test/motor_PPR_test/>

; --- 環境 t3: Servo 測試程式 (PWM=GP17)
[env:servo_test]
build_src_filter = +<test/servo_test/>
