; PlatformIO Project Configuration File
; 棒球機器人 RP2350 多環境編譯設定 (終極白名單排除語法)

; ---- 全域共享設定 ----
[env]
monitor_speed = 115200
build_flags = -I include

; --- 環境 1: Pico Hub ---
[env:pico_hub]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; board = waveshare_rp2350_plus
board = pico
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<hub/>

; --- 環境 2: Pico move ---
[env:pico_move]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<move/>

; --- 環境 3: Pico storage ---
[env:pico_storage]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<storage/>

; --- 環境 4: Pico shoot ---
[env:pico_shoot]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<shoot/>

; --- 環境 5: 超音波整合 ---
[env:ultrasonic]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<ultrasonic/>

; --- 環境 t1: DBR4 CRSF Monitor (test) ---
[env:pico_dbr4_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<test/dbr4_test/>

; --- 環境 t2: PPR 測試程式 ---
[env:motor_PPR_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<test/motor_PPR_test/>

; --- 環境 t3: Servo 測試程式 (PWM=GP17) ---
[env:servo_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<test/servo_test/>

; --- 環境 t4: RC → Move 最小通訊測試 (RP2040) ---
; DBR4 為 RP2040 板，使用 generic-rp2040 board 定義。
; 本機 Serial 115200 印除錯，PIO UART 921600 送控制幀到 Move slave。
[env:rc_move_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<test/rc_move_test/>

; --- 環境 native: 協定/演算法單元測試 (Mac 上執行，無需硬體) ---
[env:native]
platform = native
build_src_filter = -<**>
build_flags = -I include -I test/mock -std=c++17 -Wno-unknown-pragmas
test_framework = custom
test_filter = test_*
