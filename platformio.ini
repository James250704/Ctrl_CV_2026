; PlatformIO Project Configuration File
; 棒球機器人 RP2350 多環境編譯設定 (終極白名單排除語法)

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
board_build.flash_size = 16MB
monitor_speed = 115200

; --- 環境 1: Pico Hub ---
[env:pico_hub]
build_src_filter = +<hub/> 

; --- 環境 2: Pico move ---
[env:pico_move]
build_src_filter = +<move/> 

; --- 環境 3: Pico storage ---
[env:pico_storage]
build_src_filter = +<storage/> 

; --- 環境 4: Pico shoot ---
[env:pico_shoot]
build_src_filter = +<shoot/> 